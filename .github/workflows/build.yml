name: Build DropMag

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak DropMagAndroid.zip
        run: |
          mkdir work
          unzip -q DropMagAndroid.zip -d work

      - name: Ambil header AML
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml
          cp -r aml/mod work/jni/mod

      - name: Build dengan NDK
        working-directory: work
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          "$NDK/ndk-build" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk

      - name: Simpan hasil
        uses: actions/upload-artifact@v4
        with:
          name: DropMag-hasil
          path: |
            work/libs/**/libDropMag.so
            work/files/**
